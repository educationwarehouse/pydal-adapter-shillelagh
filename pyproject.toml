[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydal-shillelagh"
dynamic = ["version"]
description = "Custom pyDAL adapter for shillelagh (SQLite-to-API magic)"
readme = "README.md"
requires-python = ">=3.10"
license-expression = "MIT"
authors = [
    {name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl"}
]
urls = { "Homepage" = "https://github.com/educationwarehouse/pydal-adapter-shillelagh" }

dependencies = [
    "pydal",
    "shillelagh[all]", # todo: not [all]?
    "pip",
    "apsw<=3.47",
    # note: apsw 3.47 changes `"SQLError: no such table: "`  into `no such table: `, breaking shillelgh's `NO_SUCH_TABLE`
]

[project.optional-dependencies]
dev = [
    "hatch",
    "python-semantic-release<8",
    "su6[all]",
    "edwh",
]

[tool.setuptools.packages.find]
where = ["pydal_shillelagh"]

[tool.semantic_release]
branch = "master"
version_variable = "pydal_shillelagh/__about__.py:__version__"
change_log = "CHANGELOG.md"
upload_to_repository = false
upload_to_release = false
build_command = "hatch build"

[tool.hatch.version]
path = "pydal_shillelagh/__about__.py"
